  <meta charset="utf-8" />

  <script type="text/babel" src="screens/Login.jsx"></script>
  <script type="text/babel" src="screens/DashboardEcom.jsx"></script>
  <script type="text/babel" src="screens/ProductList.jsx"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #root { min-height: 100vh; }
    /* Screen switcher pill */
    .demo-switcher { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; gap: 4px; background: var(--color-navy-900); border-radius: var(--radius-full); padding: 4px; box-shadow: var(--shadow-2xl); border: 1px solid rgba(255,255,255,0.1); }
    .demo-btn { height: 26px; padding: 0 10px; border-radius: var(--radius-full); border: none; cursor: pointer; font-family: var(--font-sans); font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.55); background: transparent; transition: all 150ms ease; white-space: nowrap; }
    .demo-btn:hover { color: white; background: rgba(255,255,255,0.1); }
    .demo-btn--active { color: white; background: var(--color-primary-600); }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const NS = window.RockAdminDesignSystem_fced52;

// ── Icon atoms ──────────────────────────────────────
const I = {
  Home: () => <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><path d="M2 8L8 2l6 6"/><path d="M4 8v6h3v-3h2v3h3V8"/></svg>,
  Box: () => <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><path d="M8 2l6 3.5v5L8 14 2 10.5v-5L8 2z"/><line x1="8" y1="8" x2="8" y2="14"/><line x1="2" y1="5.5" x2="8" y2="8"/><line x1="14" y1="5.5" x2="8" y2="8"/></svg>,
  Tag: () => <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><path d="M2 2h6l6 6-6 6-6-6V2z"/><circle cx="5.5" cy="5.5" r="1" fill="currentColor" stroke="none"/></svg>,
  Users: () => <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><circle cx="6" cy="5" r="3"/><path d="M1 14c0-2.76 2.24-5 5-5"/><circle cx="12" cy="6" r="2.5"/><path d="M10.5 14c0-2 .8-3.5 1.5-4"/></svg>,
  Chart: () => <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><line x1="2" y1="12" x2="2" y2="4"/><line x1="6" y1="12" x2="6" y2="7"/><line x1="10" y1="12" x2="10" y2="5"/><line x1="14" y1="12" x2="14" y2="9"/><line x1="1" y1="12" x2="15" y2="12"/></svg>,
  Server: () => <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><rect x="1" y="2" width="14" height="5" rx="1"/><rect x="1" y="9" width="14" height="5" rx="1"/><circle cx="4.5" cy="4.5" r="1" fill="currentColor" stroke="none"/><circle cx="4.5" cy="11.5" r="1" fill="currentColor" stroke="none"/></svg>,
  Gear: () => <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M3.2 12.8l1.4-1.4M11.4 4.6l1.4-1.4"/></svg>,
  File: () => <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><path d="M3 1h7l4 4v10H3V1z"/><polyline points="10,1 10,5 14,5" fill="none"/></svg>,
  Image: () => <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><rect x="1" y="1" width="14" height="14" rx="2"/><circle cx="5.5" cy="5.5" r="1.5"/><polyline points="1,11 5,7 8,10 11,7 15,11"/></svg>,
  Layout: () => <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><rect x="1" y="1" width="14" height="14" rx="1"/><line x1="1" y1="5" x2="15" y2="5"/><line x1="6" y1="5" x2="6" y2="15"/></svg>,
};

// ── Nav configuration per project ──────────────────
const NAV_PROJECTS = [
  { id:'eshop', name:'E-shop',    color:'#2563eb' },
  { id:'cms',   name:'CMS',       color:'#7c3aed' },
  { id:'crm',   name:'CRM',       color:'#059669' },
];

const NAV_ITEMS = {
  eshop: [
    { id:'dashboard',  label:'Dashboard', icon:<I.Home /> },
    { id:'products',   label:'Products',  icon:<I.Box />,   children:[
      { id:'products',       label:'All Products' },
      { id:'categories',     label:'Categories' },
      { id:'inventory',      label:'Inventory', badge:3 },
    ]},
    { id:'orders',     label:'Orders',    icon:<I.Tag />,   children:[
      { id:'orders-new',     label:'New Orders',  badge:12 },
      { id:'orders-ship',    label:'Shipped' },
      { id:'orders-return',  label:'Returns',     badge:2 },
    ]},
    { id:'customers',  label:'Customers', icon:<I.Users /> },
    { id:'analytics',  label:'Analytics', icon:<I.Chart /> },
    { id:'monitoring', label:'Monitoring',icon:<I.Server /> },
    { id:'settings',   label:'Settings',  icon:<I.Gear /> },
  ],
  cms: [
    { id:'dashboard',  label:'Dashboard', icon:<I.Home /> },
    { id:'pages',      label:'Pages',     icon:<I.File />,  children:[
      { id:'pages-all',      label:'All Pages' },
      { id:'pages-drafts',   label:'Drafts',    badge:4 },
    ]},
    { id:'media',      label:'Media',     icon:<I.Image /> },
    { id:'templates',  label:'Templates', icon:<I.Layout /> },
    { id:'settings',   label:'Settings',  icon:<I.Gear /> },
  ],
  crm: [
    { id:'dashboard',  label:'Dashboard', icon:<I.Home /> },
    { id:'contacts',   label:'Contacts',  icon:<I.Users />, children:[
      { id:'contacts-all',   label:'All Contacts' },
      { id:'contacts-new',   label:'New Leads',   badge:7 },
    ]},
    { id:'deals',      label:'Deals',     icon:<I.Tag />,   badge:5 },
    { id:'analytics',  label:'Analytics', icon:<I.Chart /> },
    { id:'settings',   label:'Settings',  icon:<I.Gear /> },
  ],
};

const NOTIFICATIONS = [
  { title:'New order #4821 — €298', description:'Customer: Jan Novák', time:'2m ago', unread:true },
  { title:'Low stock: AirMax Pro (3 left)', time:'18m ago', unread:true },
  { title:'Export ready to download', time:'1h ago', unread:false },
  { title:'System backup completed', time:'3h ago', unread:false },
];

// ── Screen mapping ────────────────────────────────
function renderContent(screen, navigate) {
  const screens = {
    'dashboard':   <window.DashboardEcomScreen />,
    'products':    <window.ProductListScreen onNavigate={navigate} />,
    'form-add':    <window.FormAddScreen onNavigate={navigate} />,
    'settings':    <window.SettingsScreen />,
    'monitoring':  <window.MonitoringScreen />,
  };
  return screens[screen] || (
    <div style={{padding:'var(--space-16)',textAlign:'center',color:'var(--text-muted)'}}>
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" strokeWidth="1.2" style={{margin:'0 auto 12px',display:'block',opacity:.3}}>
        <rect x="8" y="8" width="32" height="32" rx="4"/><line x1="16" y1="20" x2="32" y2="20"/><line x1="16" y1="28" x2="24" y2="28"/>
      </svg>
      <div style={{fontWeight:600,marginBottom:4}}>Screen coming soon</div>
      <div style={{fontSize:'var(--text-sm)'}}>This section is a placeholder in this demo.</div>
    </div>
  );
}

const SCREEN_LABELS = { dashboard:'Dashboard', products:'Products', 'form-add':'New Product', settings:'Settings', monitoring:'Monitoring' };

// ── Main App ──────────────────────────────────────
function App() {
  const { TopNavbar, SecondNavbar, Breadcrumb } = NS;
  const [loggedIn, setLoggedIn] = React.useState(true);
  const [screen, setScreen]   = React.useState('dashboard');
  const [project, setProject] = React.useState('eshop');
  const [notifs, setNotifs]   = React.useState(NOTIFICATIONS);
  const [mobileNav, setMobileNav] = React.useState(false);

  const navigate = React.useCallback((s) => setScreen(s), []);

  // Map nav item clicks → screen
  const handleNav = (id) => {
    if (id === 'products' || id === 'products-all' || id === 'products-list') navigate('products');
    else if (id === 'form-add') navigate('form-add');
    else if (id === 'monitoring') navigate('monitoring');
    else if (id === 'settings') navigate('settings');
    else if (id === 'dashboard') navigate('dashboard');
    else setScreen(id);
  };

  const activeNavId = screen === 'form-add' ? 'products' : screen;

  if (!loggedIn) {
    return <window.LoginScreen onLogin={() => { setLoggedIn(true); setScreen('dashboard'); }} />;
  }

  const items = NAV_ITEMS[project] || NAV_ITEMS.eshop;
  const isFormScreen = screen === 'form-add';

  return (
    <div className="ra-page">
      <TopNavbar
        brandName="Rock Admin"
        projects={NAV_PROJECTS}
        activeProject={project}
        onProjectChange={(id) => { setProject(id); setScreen('dashboard'); }}
        notifications={notifs}
        onMarkAllRead={() => setNotifs(n => n.map(x => ({...x, unread:false})))}
        user={{ name:'Jan Novák', email:'jan@company.cz' }}
        onLogout={() => setLoggedIn(false)}
        onMobileMenuOpen={() => setMobileNav(true)}
      />
      <SecondNavbar
        items={items}
        activeId={activeNavId}
        onNavigate={handleNav}
        projectLabel={NAV_PROJECTS.find(p=>p.id===project)?.name}
        mobileOpen={mobileNav}
        onMobileClose={() => setMobileNav(false)}
      />
      <main style={{ flex:1, padding:'var(--page-padding-y) var(--page-padding-x)' }}>
        {renderContent(screen, navigate)}
      </main>

      {/* Footer */}
      <NS.Footer copyright="Tomáš Hruby" usefulLinks={[
        { label:'Documentation', onClick:()=>{} },
        { label:'Changelog', onClick:()=>{} },
        { divider:true },
        { label:'API Reference', onClick:()=>{} },
        { label:'Support', onClick:()=>{} },
        { label:'Privacy Policy', onClick:()=>{} },
      ]} />

      {/* Demo screen switcher pill */}
      <div className="demo-switcher">
        {['dashboard','products','form-add','settings','monitoring'].map(s => (
          <button key={s} className={`demo-btn ${screen===s?'demo-btn--active':''}`} onClick={() => navigate(s)}>
            {SCREEN_LABELS[s]}
          </button>
        ))}
        <button className="demo-btn" onClick={() => setLoggedIn(false)} title="Show login">Login</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>

</body>
</html>
