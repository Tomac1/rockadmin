<!-- @dsCard group="Components" viewport="700x560" name="Data Display" subtitle="Table, Badge, Avatar, TreeView" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--bg-page)} .label{font-size:11px;color:var(--text-muted);font-family:var(--font-sans);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px} .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Table, Badge, Avatar, AvatarGroup, TreeView } = window.RockAdminDesignSystem_fced52;
const EditIcon = () => <svg width="13" height="13" viewBox="0 0 14 14" stroke="currentColor" strokeWidth="2" strokeLinecap="round" fill="none"><path d="M2,12l2-1 7-7-1-1-7,7-1,2z"/></svg>;
const TrashIcon = () => <svg width="13" height="13" viewBox="0 0 14 14" stroke="currentColor" strokeWidth="2" strokeLinecap="round" fill="none"><polyline points="2,3 12,3"/><path d="M5,3V2h4v1M3,3l1,9h6l1-9"/></svg>;

const ROWS = [
  { id:1, name:'AirMax Pro Sneakers', category:'Footwear', price:'€149', status:'active', stock:142 },
  { id:2, name:'Leather Jacket Classic', category:'Clothing', price:'€389', status:'active', stock:23 },
  { id:3, name:'Wireless Headphones X', category:'Electronics', price:'€229', status:'draft', stock:0 },
  { id:4, name:'Running Shorts Elite', category:'Sports', price:'€59', status:'active', stock:88 },
];
const COLS = [
  { key:'name', label:'Product', sortable:true },
  { key:'category', label:'Category' },
  { key:'price', label:'Price', align:'right' },
  { key:'stock', label:'Stock', align:'right', render:(v) => <span style={{color: v===0?'var(--color-error-600)':v<30?'var(--color-warning-600)':'var(--text-primary)',fontWeight:500}}>{v}</span> },
  { key:'status', label:'Status', render:(v) => <Badge color={v==='active'?'green':'gray'} dot>{v}</Badge> },
  { key:'_actions', label:'', width:80, render:(_,row) => <div style={{display:'flex',gap:4}}>
    <button style={{width:26,height:26,border:'1px solid var(--border-color)',borderRadius:4,background:'white',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text-muted)'}}><EditIcon /></button>
    <button style={{width:26,height:26,border:'1px solid var(--border-color)',borderRadius:4,background:'white',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--color-error-400)'}}><TrashIcon /></button>
  </div> },
];
const TREE_NODES = [
  { id:'pages', label:'Pages', children:[
    { id:'home', label:'Home', children:[ { id:'hero', label:'Hero Section' }, { id:'features', label:'Features' } ] },
    { id:'about', label:'About Us' },
    { id:'blog', label:'Blog', children:[ { id:'post1', label:'Post: Rock Admin v2' }, { id:'post2', label:'Post: Best Practices' } ] },
  ]},
  { id:'products-pg', label:'Products', children:[ { id:'cat-elect', label:'Electronics' }, { id:'cat-cloth', label:'Clothing' } ] },
];
const TREE_COLS = [
  { key:'label', label:'Page', width:280 },
  { key:'slug', label:'Slug', render:(_,n) => <span style={{fontFamily:'var(--font-mono)',fontSize:'var(--text-xs)',color:'var(--text-muted)'}}>/{n.label.toLowerCase().replace(/ /g,'-')}</span> },
  { key:'status', label:'Status', render:() => <Badge color="green" size="xs" dot>Published</Badge> },
];

function App() {
  const [sel, setSel] = React.useState([]);
  return (
    <div style={{fontFamily:'var(--font-sans)'}}>
      <div className="label">Badges</div>
      <div className="row">
        {['gray','blue','green','yellow','red','indigo','purple','teal','orange'].map(c=><Badge key={c} color={c}>{c}</Badge>)}
        <Badge color="green" dot pulse>Live</Badge>
        <Badge color="blue" solid>New</Badge>
        <Badge color="red" solid>5</Badge>
      </div>
      <div className="label" style={{marginTop:8}}>Avatars</div>
      <div className="row" style={{alignItems:'center'}}>
        <Avatar name="Jan Novák" size="xs"/><Avatar name="Marie Dvořák" size="sm"/><Avatar name="Petr Svoboda" size="md"/>
        <Avatar name="Anna Procházková" size="lg"/>
        <div style={{width:1,height:32,background:'var(--border-color)'}}/>
        <AvatarGroup avatars={[{name:'Jan N'},{name:'Marie D'},{name:'Petr S'},{name:'Anna P'},{name:'Karel N'}]} max={4} size="sm"/>
      </div>
      <div className="label" style={{marginTop:8}}>Table</div>
      <Table columns={COLS} rows={ROWS} selectable selectedIds={sel} onSelectChange={setSel}
        searchPlaceholder="Search products..." onSearchChange={()=>{}}
        pagination={{page:1,pages:4,total:32,info:'1–4 of 32 products',onChange:()=>{}}} />
      <div className="label" style={{marginTop:8}}>Tree View</div>
      <TreeView nodes={TREE_NODES} columns={TREE_COLS} defaultExpanded={['pages','home']} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
