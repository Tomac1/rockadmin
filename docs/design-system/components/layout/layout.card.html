<!-- @dsCard group="Components" viewport="700x380" name="Layout" subtitle="Card, PageHeader, InpageSidebar" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--bg-page)} .label{font-size:11px;color:var(--text-muted);font-family:var(--font-sans);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Card, PageHeader, InpageSidebar, InpageLayout, Button, Badge } = window.RockAdminDesignSystem_fced52;
const PlusIcon = () => <svg width="13" height="13" viewBox="0 0 14 14" stroke="currentColor" strokeWidth="2" strokeLinecap="round" fill="none"><line x1="7" y1="1" x2="7" y2="13"/><line x1="1" y1="7" x2="13" y2="7"/></svg>;
const DownloadIcon = () => <svg width="13" height="13" viewBox="0 0 14 14" stroke="currentColor" strokeWidth="2" strokeLinecap="round" fill="none"><line x1="7" y1="1" x2="7" y2="9"/><polyline points="3,5 7,9 11,5"/><line x1="1" y1="13" x2="13" y2="13"/></svg>;
const GearIcon = () => <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2"/></svg>;
const UserIcon = () => <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3.31 2.69-6 6-6s6 2.69 6 6"/></svg>;
const ShieldIcon = () => <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><path d="M8 2L3 4v4c0 3 2.5 5.5 5 6 2.5-.5 5-3 5-6V4L8 2z"/></svg>;

const SIDEBAR_SECTIONS = [
  { label: 'General', items: [
    { id: 'general', label: 'General', icon: <GearIcon /> },
    { id: 'profile',  label: 'Profile', icon: <UserIcon /> },
  ]},
  { label: 'Security', items: [
    { id: 'security', label: 'Security', icon: <ShieldIcon /> },
  ]},
];

function App() {
  const [active, setActive] = React.useState('general');
  return (
    <div style={{fontFamily:'var(--font-sans)'}}>
      <div className="label">Page Header</div>
      <div style={{background:'var(--bg-page)',padding:'0 4px',borderRadius:8,border:'1px solid var(--border-color)'}}>
        <PageHeader title="Products" description="Manage your product catalog across all channels."
          meta={<><Badge color="blue">142 active</Badge><Badge color="gray">8 draft</Badge></>}
          actions={<><Button variant="secondary" leftIcon={<DownloadIcon />} size="sm">Export</Button><Button leftIcon={<PlusIcon />} size="sm">New Product</Button></>} />
      </div>
      <div className="label">Cards</div>
      <div className="ra-cols-3" style={{gap:12}}>
        <Card title="Card Title" subtitle="Card subtitle" actions={<Button variant="ghost" size="sm">Edit</Button>}>
          <p style={{fontSize:'var(--text-sm)',color:'var(--text-secondary)',margin:0}}>Card body content goes here. Use cards to group related information.</p>
        </Card>
        <Card title="With Footer" footer={<Button variant="secondary" size="sm" fullWidth>View All</Button>}>
          <p style={{fontSize:'var(--text-sm)',color:'var(--text-secondary)',margin:0}}>Cards can have optional footer sections for actions.</p>
        </Card>
        <Card hoverable title="Hoverable" subtitle="Click to open">
          <p style={{fontSize:'var(--text-sm)',color:'var(--text-secondary)',margin:0}}>Cards can be made clickable with hover state.</p>
        </Card>
      </div>
      <div className="label">Inpage Sidebar Layout</div>
      <div style={{border:'1px solid var(--border-color)',borderRadius:8,overflow:'hidden',height:130}}>
        <InpageLayout sidebar={<InpageSidebar sections={SIDEBAR_SECTIONS} activeId={active} onSelect={setActive} />}>
          <div style={{fontSize:'var(--text-sm)',color:'var(--text-secondary)'}}>Settings panel content for: <strong>{active}</strong></div>
        </InpageLayout>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
