<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg-page)} .label{font-size:11px;color:var(--text-muted);font-family:var(--font-sans);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:10px 16px 4px}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { TopNavbar, SecondNavbar, Breadcrumb } = window.RockAdminDesignSystem_fced52;
const HomeIcon = () => <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><path d="M2 8L8 2l6 6"/><path d="M4 8v6h3v-3h2v3h3V8"/></svg>;
const BoxIcon = () => <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><path d="M8 2l6 3.5v5L8 14 2 10.5v-5L8 2z"/><line x1="8" y1="8" x2="8" y2="14"/><line x1="2" y1="5.5" x2="8" y2="8"/><line x1="14" y1="5.5" x2="8" y2="8"/></svg>;
const TagIcon = () => <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><path d="M2 2h6l6 6-6 6-6-6V2z"/><circle cx="6" cy="6" r="1" fill="currentColor" stroke="none"/></svg>;
const UsersIcon = () => <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><circle cx="6" cy="5" r="3"/><path d="M1 14c0-2.76 2.24-5 5-5"/><circle cx="12" cy="6" r="2"/><path d="M10 14c0-2 .9-3.5 2-4"/></svg>;
const ChartIcon = () => <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><line x1="2" y1="12" x2="2" y2="4"/><line x1="6" y1="12" x2="6" y2="7"/><line x1="10" y1="12" x2="10" y2="5"/><line x1="14" y1="12" x2="14" y2="9"/><line x1="1" y1="12" x2="15" y2="12"/></svg>;
const GearIcon = () => <svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M3.2 12.8l1.4-1.4M11.4 4.6l1.4-1.4"/></svg>;

const NOTIFS = [
  { title: 'New order #4821 received', description: 'Customer: Jan Novák — €149.00', time: '2m ago', unread: true },
  { title: 'Product "AirMax Pro" low stock', description: 'Only 3 units remaining', time: '18m ago', unread: true },
  { title: 'Export completed', time: '1h ago', unread: false },
];
const PROJECTS = [
  { id: 'eshop', name: 'E-shop', color: '#2563eb' },
  { id: 'cms',   name: 'CMS',   color: '#7c3aed' },
  { id: 'crm',   name: 'CRM',   color: '#059669' },
];
const NAV_ITEMS = [
  { id: 'dashboard', label: 'Dashboard', icon: <HomeIcon /> },
  { id: 'products', label: 'Products', icon: <BoxIcon />, children: [
    { id: 'products-list', label: 'All Products', badge: 0 },
    { id: 'categories', label: 'Categories' },
    { id: 'inventory', label: 'Inventory', badge: 5 },
  ]},
  { id: 'orders', label: 'Orders', icon: <TagIcon />, badge: 12, children: [
    { id: 'orders-new', label: 'New Orders', badge: 12 },
    { id: 'orders-shipped', label: 'Shipped' },
    { id: 'orders-returns', label: 'Returns', badge: 3 },
  ]},
  { id: 'customers', label: 'Customers', icon: <UsersIcon /> },
  { id: 'analytics', label: 'Analytics', icon: <ChartIcon /> },
  { id: 'settings', label: 'Settings', icon: <GearIcon /> },
];

function App() {
  const [proj, setProj] = React.useState('eshop');
  const [active, setActive] = React.useState('products-list');
  return (
    <div>
      <TopNavbar
        brandName="Rock Admin"
        projects={PROJECTS}
        activeProject={proj}
        onProjectChange={setProj}
        notifications={NOTIFS}
        user={{ name: 'Jan Novák', email: 'jan@company.cz' }}
      />
      <SecondNavbar items={NAV_ITEMS} activeId={active} onNavigate={setActive} />
      <div style={{padding:'12px 16px'}}>
        <Breadcrumb items={[{label:'Products'},{label:'All Products'}]} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
