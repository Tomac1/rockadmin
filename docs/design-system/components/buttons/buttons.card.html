<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{margin:0;padding:16px;background:var(--bg-page)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.label{font-size:11px;color:var(--text-muted);font-family:var(--font-sans);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton } = window.RockAdminDesignSystem_fced52;
const PlusIcon = () => <svg width="13" height="13" viewBox="0 0 14 14" stroke="currentColor" strokeWidth="2" strokeLinecap="round" fill="none"><line x1="7" y1="1" x2="7" y2="13"/><line x1="1" y1="7" x2="13" y2="7"/></svg>;
const DownloadIcon = () => <svg width="13" height="13" viewBox="0 0 14 14" stroke="currentColor" strokeWidth="2" strokeLinecap="round" fill="none"><line x1="7" y1="1" x2="7" y2="9"/><polyline points="3,5 7,9 11,5"/><line x1="1" y1="13" x2="13" y2="13"/></svg>;
const TrashIcon = () => <svg width="13" height="13" viewBox="0 0 14 14" stroke="currentColor" strokeWidth="2" strokeLinecap="round" fill="none"><polyline points="2,3 12,3"/><path d="M5,3V2h4v1M3,3l1,9h6l1-9"/></svg>;
const EditIcon = () => <svg width="13" height="13" viewBox="0 0 14 14" stroke="currentColor" strokeWidth="2" strokeLinecap="round" fill="none"><path d="M2,12l2-1 7-7-1-1-7,7-1,2z"/><path d="M10,3l1,1"/></svg>;
const GridIcon = () => <svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><rect x="1" y="1" width="5" height="5" rx="1"/><rect x="8" y="1" width="5" height="5" rx="1"/><rect x="1" y="8" width="5" height="5" rx="1"/><rect x="8" y="8" width="5" height="5" rx="1"/></svg>;
const ListIcon = () => <svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"><line x1="1" y1="3" x2="13" y2="3"/><line x1="1" y1="7" x2="13" y2="7"/><line x1="1" y1="11" x2="13" y2="11"/></svg>;

function App() {
  return (
    <div style={{fontFamily:'var(--font-sans)'}}>
      <div className="label">Variants</div>
      <div className="row">
        <Button variant="primary">Primary</Button>
        <Button variant="secondary">Secondary</Button>
        <Button variant="outline">Outline</Button>
        <Button variant="ghost">Ghost</Button>
        <Button variant="danger">Danger</Button>
        <Button variant="danger-ghost">Danger Ghost</Button>
        <Button variant="success">Success</Button>
      </div>
      <div className="label">Sizes</div>
      <div className="row" style={{alignItems:'center'}}>
        <Button size="sm">Small</Button>
        <Button size="md">Medium</Button>
        <Button size="lg">Large</Button>
        <Button size="xl">X-Large</Button>
      </div>
      <div className="label">With Icons & States</div>
      <div className="row">
        <Button leftIcon={<PlusIcon />}>New Item</Button>
        <Button variant="secondary" leftIcon={<DownloadIcon />}>Export</Button>
        <Button variant="danger" leftIcon={<TrashIcon />} size="sm">Delete</Button>
        <Button loading>Saving...</Button>
        <Button disabled>Disabled</Button>
        <Button variant="secondary" rightIcon={<EditIcon />}>Edit</Button>
      </div>
      <div className="label">Icon Buttons</div>
      <div className="row" style={{alignItems:'center'}}>
        <IconButton icon={<PlusIcon />} variant="default" title="Add"/>
        <IconButton icon={<EditIcon />} variant="bordered" title="Edit"/>
        <IconButton icon={<TrashIcon />} variant="danger" title="Delete"/>
        <IconButton icon={<GridIcon />} variant="bordered" size="md" title="Grid view" active/>
        <IconButton icon={<ListIcon />} variant="bordered" size="md" title="List view"/>
        <IconButton icon={<PlusIcon />} size="lg" variant="default" title="Large"/>
        <IconButton icon={<PlusIcon />} size="sm" variant="bordered" title="Small"/>
        <IconButton icon={<PlusIcon />} size="xs" variant="bordered" title="XS"/>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
