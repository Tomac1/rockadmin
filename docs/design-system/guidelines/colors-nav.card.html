<!-- @dsCard group="Colors" viewport="700x180" name="Navy — Navbar Palette" subtitle="Dark backgrounds for TopNavbar and SecondNavbar" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg-page);font-family:var(--font-sans)} .row{display:flex;gap:12px;align-items:stretch} .s{flex:1;height:72px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:600;gap:3px;color:rgba(255,255,255,.7)} .val{font-size:9px;opacity:.55;font-weight:400;font-family:monospace}</style>
</head><body>
<div class="row">
  <div class="s" style="background:var(--color-navy-950)"><span>Navy 950</span><span class="val">080c14</span></div>
  <div class="s" style="background:var(--color-navy-900);outline:2px solid rgba(255,255,255,.15);outline-offset:-2px"><span>Navy 900 ✦ TopNav</span><span class="val">0d1117</span></div>
  <div class="s" style="background:var(--color-navy-800);outline:2px solid rgba(255,255,255,.12);outline-offset:-2px"><span>Navy 800 ✦ SecNav</span><span class="val">161b26</span></div>
  <div class="s" style="background:var(--color-navy-700)"><span>Navy 700</span><span class="val">1c2338</span></div>
  <div class="s" style="background:var(--color-navy-600)"><span>Navy 600</span><span class="val">232d4a</span></div>
  <div class="s" style="background:var(--color-navy-500)"><span>Navy 500</span><span class="val">2c3a5e</span></div>
  <div style="flex:1;border-radius:8px;border:1px solid var(--border-color);display:flex;flex-direction:column;overflow:hidden">
    <div style="flex:1;background:var(--nav-primary-bg);display:flex;align-items:center;padding:0 12px;gap:8px">
      <div style="width:20px;height:20px;background:#2563eb;border-radius:4px"></div>
      <span style="color:white;font-size:12px;font-weight:600">Rock Admin</span>
      <div style="flex:1"></div>
      <span style="color:rgba(255,255,255,.5);font-size:10px">● Settings ▾  User ▾</span>
    </div>
    <div style="flex:1;background:var(--nav-secondary-bg);display:flex;align-items:center;padding:0 12px;gap:16px">
      <span style="color:rgba(255,255,255,.55);font-size:11px">Dashboard</span>
      <span style="color:white;font-size:11px;font-weight:500;border-bottom:2px solid #3b82f6;padding-bottom:2px">Products</span>
      <span style="color:rgba(255,255,255,.55);font-size:11px">Orders</span>
    </div>
  </div>
</div></body></html>
