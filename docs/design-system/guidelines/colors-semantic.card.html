<!-- @dsCard group="Colors" viewport="700x180" name="Semantic Colors" subtitle="Success, Warning, Error, Info — with bg/text/border triads" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg-page);font-family:var(--font-sans)} .row{display:flex;gap:12px} .group{flex:1;display:flex;gap:3px} .s{flex:1;height:56px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600} .label{font-size:10px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;text-align:center}</style>
</head><body>
<div class="row">
  <div><div class="label">Success</div><div class="group"><div class="s" style="background:var(--color-success-50);color:var(--color-success-700)">50</div><div class="s" style="background:var(--color-success-500);color:white">500</div><div class="s" style="background:var(--color-success-700);color:white">700</div></div></div>
  <div><div class="label">Warning</div><div class="group"><div class="s" style="background:var(--color-warning-50);color:var(--color-warning-700)">50</div><div class="s" style="background:var(--color-warning-500);color:white">500</div><div class="s" style="background:var(--color-warning-700);color:white">700</div></div></div>
  <div><div class="label">Error</div><div class="group"><div class="s" style="background:var(--color-error-50);color:var(--color-error-700)">50</div><div class="s" style="background:var(--color-error-500);color:white">500</div><div class="s" style="background:var(--color-error-700);color:white">700</div></div></div>
  <div><div class="label">Info</div><div class="group"><div class="s" style="background:var(--color-info-50);color:var(--color-info-700)">50</div><div class="s" style="background:var(--color-info-500);color:white">500</div><div class="s" style="background:var(--color-info-700);color:white">700</div></div></div>
  <div><div class="label">Accents</div><div class="group"><div class="s" style="background:var(--color-indigo-500);color:white">ind</div><div class="s" style="background:var(--color-violet-500);color:white">vio</div><div class="s" style="background:var(--color-teal-500);color:white">tea</div><div class="s" style="background:var(--color-orange-500);color:white">ora</div><div class="s" style="background:var(--color-pink-500);color:white">pnk</div></div></div>
</div></body></html>
