<!-- @dsCard group="Spacing" viewport="700x150" name="Border Radii" subtitle="--radius-none through full" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 16px;background:var(--bg-page);font-family:var(--font-sans)} .row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap} .cell{display:flex;flex-direction:column;align-items:center;gap:8px} .box{width:56px;height:56px;background:var(--color-primary-100);border:2px solid var(--color-primary-400)} .tok{font-size:10px;color:var(--text-muted);font-family:monospace}</style>
</head><body>
<div class="row">
  <div class="cell"><div class="box" style="border-radius:var(--radius-none)"></div><div class="tok">none / 0</div></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="tok">xs / 2px</div></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="tok">sm / 4px</div></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-md)"></div><div class="tok">md / 6px ✦btn</div></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="tok">lg / 8px ✦card</div></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="tok">xl / 12px ✦modal</div></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="tok">2xl / 16px</div></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-3xl)"></div><div class="tok">3xl / 24px</div></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-full);width:56px;height:56px"></div><div class="tok">full / pill</div></div>
</div></body></html>
