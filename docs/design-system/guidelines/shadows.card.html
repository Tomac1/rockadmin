<!-- @dsCard group="Spacing" viewport="700x160" name="Shadow Scale" subtitle="--shadow-xs through 2xl + semantic shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px 16px;background:var(--color-neutral-100);font-family:var(--font-sans)} .row{display:flex;gap:16px;justify-content:space-around} .cell{display:flex;flex-direction:column;align-items:center;gap:10px} .box{width:72px;height:52px;background:var(--bg-surface);border-radius:6px} .tok{font-size:10px;color:var(--text-muted);font-family:monospace}</style>
</head><body>
<div class="row">
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="tok">xs</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="tok">sm ✦card</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="tok">md</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="tok">lg ✦dropdown</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="tok">xl</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-2xl)"></div><div class="tok">2xl ✦modal</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-focus);border:1px solid var(--border-focus)"></div><div class="tok">focus</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-focus-error);border:1px solid var(--color-error-500)"></div><div class="tok">focus-error</div></div>
</div></body></html>
