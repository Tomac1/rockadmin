<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing Scale" subtitle="4px base — --space-0-5 through space-24" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg-page);font-family:var(--font-sans)} .row{display:flex;align-items:flex-end;gap:4px;flex-wrap:wrap} .cell{display:flex;flex-direction:column;align-items:center;gap:4px} .bar{background:var(--color-primary-400);border-radius:2px;width:28px} .tok{font-size:9px;color:var(--text-muted);font-family:monospace;transform:rotate(-40deg);transform-origin:top center;margin-top:6px;white-space:nowrap}</style>
</head><body>
<div class="row">
  <div class="cell"><div class="bar" style="height:2px"></div><div class="tok">0.5</div></div>
  <div class="cell"><div class="bar" style="height:4px"></div><div class="tok">1</div></div>
  <div class="cell"><div class="bar" style="height:6px"></div><div class="tok">1.5</div></div>
  <div class="cell"><div class="bar" style="height:8px"></div><div class="tok">2</div></div>
  <div class="cell"><div class="bar" style="height:10px"></div><div class="tok">2.5</div></div>
  <div class="cell"><div class="bar" style="height:12px"></div><div class="tok">3</div></div>
  <div class="cell"><div class="bar" style="height:14px"></div><div class="tok">3.5</div></div>
  <div class="cell"><div class="bar" style="height:16px"></div><div class="tok">4 ✦</div></div>
  <div class="cell"><div class="bar" style="height:20px"></div><div class="tok">5</div></div>
  <div class="cell"><div class="bar" style="height:24px"></div><div class="tok">6 ✦</div></div>
  <div class="cell"><div class="bar" style="height:28px"></div><div class="tok">7</div></div>
  <div class="cell"><div class="bar" style="height:32px"></div><div class="tok">8</div></div>
  <div class="cell"><div class="bar" style="height:40px"></div><div class="tok">10</div></div>
  <div class="cell"><div class="bar" style="height:48px"></div><div class="tok">12</div></div>
  <div class="cell"><div class="bar" style="height:56px"></div><div class="tok">14</div></div>
  <div class="cell"><div class="bar" style="height:64px"></div><div class="tok">16</div></div>
  <div class="cell"><div class="bar" style="height:80px"></div><div class="tok">20</div></div>
  <div class="cell"><div class="bar" style="height:96px"></div><div class="tok">24</div></div>
</div></body></html>
