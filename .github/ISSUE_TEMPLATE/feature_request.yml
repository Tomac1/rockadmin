name: Feature request
description: Suggest a capability RockAdmin should have.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that RockAdmin makes hard or impossible?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed configuration
      description: If it were configurable, what would the configuration look like?
      render: php

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Template overrides, a custom RowSource, a query callback, ...

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This can be implemented without adding a Composer dependency.
          required: false
        - label: This works the same on MySQL and PostgreSQL.
          required: false
