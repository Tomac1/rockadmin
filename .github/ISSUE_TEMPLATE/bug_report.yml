name: Bug report
description: Something in RockAdmin does not behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** report security vulnerabilities here.
        Use private reporting instead — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest configuration and steps that show the problem.
      placeholder: |
        1. config/rockadmin/pages/ads.php contains ...
        2. Open /admin/p/ads
        3. ...
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: The page or config excerpt involved. Remove credentials first.
      render: php

  - type: input
    id: version
    attributes:
      label: RockAdmin version
    validations:
      required: true

  - type: input
    id: php
    attributes:
      label: PHP version
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [MySQL, MariaDB, PostgreSQL, Other]
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Host application
      description: Laravel 12, Symfony 7, plain PHP, ...
