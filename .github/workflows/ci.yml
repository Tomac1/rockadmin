name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: rockadmin_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: root
          POSTGRES_DB: rockadmin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready --health-interval=10s
          --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, pdo_pgsql, json, mbstring
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-stable

      - name: Validate composer.json
        run: composer validate --strict

      - name: Coding standards
        run: composer run cs

      - name: Static analysis
        run: composer run stan

      - name: Tests
        run: composer run test
        env:
          RA_TEST_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=rockadmin_test'
          RA_TEST_MYSQL_USER: root
          RA_TEST_MYSQL_PASSWORD: root
          RA_TEST_PGSQL_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=rockadmin_test'
          RA_TEST_PGSQL_USER: postgres
          RA_TEST_PGSQL_PASSWORD: root
